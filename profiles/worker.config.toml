# Worker configuration for `codex-in-anti`.
# Place at `$CODEX_HOME/worker.config.toml` (default: `~/.codex/worker.config.toml`).
#
# How `codex_run.py` uses this file:
# - `--config-mode isolated` (default on Python 3.11+): passes `--ignore-user-config` to Codex CLI
#   and whitelist-extracts ONLY `model`, `model_provider`, `model_reasoning_effort`, `personality`,
#   `tool_output_token_limit`, `developer_instructions`, plus provider/proxy settings from `config.toml`.
#   Desktop plugins, MCP servers, hooks, memories, and chronicle are completely ignored.
# - `--config-mode profile` (fallback on Python 3.10): passes `-p worker` layered on top of
#   `~/.codex/config.toml` and relies on the explicit disable blocks below.

personality = "pragmatic"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
notify = []
tool_output_token_limit = 10000

# Optional: pin a dedicated model or provider for worker runs.
# model = "o3"
# model_provider = "openai"

developer_instructions = """
You are running as a non-interactive worker invoked by an orchestrator agent.
Execute the bounded task directly and thoroughly within the workspace.
Do not spawn subagents, do not ask interactive follow-up questions, and do not modify files outside the requested scope.
Run concrete verification commands (tests, linters, or scripts) for every change when possible.
Report concise, factual results: changed file paths, exact verification commands and outcomes, and any remaining risks or blockers.
"""

# --- Settings below apply when running in `--config-mode profile` (`codex exec -p worker`) ---

[agents]
enabled = false

[features]
hooks = false
js_repl = false
memories = false
chronicle = false

[memories]
generate_memories = false
use_memories = false

[mcp_servers.computer-use]
enabled = false

[mcp_servers.node_repl]
enabled = false

# Add any custom heavy MCP servers from your `~/.codex/config.toml` if using `profile` mode:
