<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Worker</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #1f2328);
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif);
      font-size: 13px;
      line-height: 1.5;
    }

    .app {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--color-border-primary, #e5e7eb);
    }

    .run-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, #d0d7de);
      background: var(--color-background-secondary, #f6f8fa);
      color: var(--color-text-secondary, #57606a);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .run-tab.active {
      background: var(--color-background-tertiary, #eaeef2);
      color: var(--color-text-primary, #1f2328);
      border-color: var(--color-ring-primary, #0969da);
      font-weight: 600;
    }

    .card {
      border: 1px solid var(--color-border-primary, #d0d7de);
      border-radius: 10px;
      background: var(--color-background-secondary, #f8fafc);
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: var(--color-background-primary, #ffffff);
      border-bottom: 1px solid var(--color-border-primary, #e5e7eb);
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .status-running {
      background: var(--color-background-info, rgba(9, 105, 218, 0.12));
      color: var(--color-text-info, #0969da);
    }

    .status-done {
      background: var(--color-background-success, rgba(26, 127, 55, 0.12));
      color: var(--color-text-success, #1a7f37);
    }

    .status-error {
      background: var(--color-background-danger, rgba(207, 34, 46, 0.12));
      color: var(--color-text-danger, #cf222e);
    }

    .status-cancelled {
      background: var(--color-background-tertiary, rgba(110, 118, 129, 0.15));
      color: var(--color-text-secondary, #57606a);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }

    .dot.pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .meta-pill {
      padding: 1.5px 7px;
      border-radius: 5px;
      font-size: 11.5px;
      background: var(--color-background-tertiary, #eef2f6);
      color: var(--color-text-secondary, #57606a);
      border: 1px solid var(--color-border-secondary, rgba(128, 128, 128, 0.2));
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .timer-pill {
      font-size: 11.5px;
      color: var(--color-text-secondary, #57606a);
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .btn {
      padding: 2px 9px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--color-border-primary, #d0d7de);
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #1f2328);
    }

    .btn:hover {
      background: var(--color-background-tertiary, #f3f4f6);
    }

    .btn-danger {
      color: var(--color-text-danger, #cf222e);
      border-color: var(--color-border-danger, rgba(207, 34, 46, 0.35));
    }

    .prompt-bar {
      padding: 6px 12px;
      font-size: 12px;
      color: var(--color-text-secondary, #57606a);
      border-bottom: 1px solid var(--color-border-primary, #e5e7eb);
      background: var(--color-background-secondary, #f8fafc);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timeline {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 440px;
      overflow-y: auto;
    }

    .empty-hint {
      padding: 10px 4px;
      font-size: 12px;
      color: var(--color-text-tertiary, #6e7781);
    }

    .commentary {
      font-size: 12.5px;
      color: var(--color-text-primary, #1f2328);
      padding: 2px 2px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cmd-block {
      border: 1px solid var(--color-border-primary, #e2e8f0);
      border-radius: 7px;
      background: var(--color-background-primary, #ffffff);
      overflow: hidden;
    }

    .cmd-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 9px;
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      color: var(--color-text-primary, #1f2328);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    .cmd-row:hover {
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.08));
    }

    .cmd-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .cmd-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cmd-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .exit-badge {
      padding: 0 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .exit-ok {
      background: var(--color-background-success, rgba(26, 127, 55, 0.14));
      color: var(--color-text-success, #1a7f37);
    }

    .exit-fail {
      background: var(--color-background-danger, rgba(207, 34, 46, 0.14));
      color: var(--color-text-danger, #cf222e);
    }

    .exit-run {
      background: var(--color-background-info, rgba(9, 105, 218, 0.14));
      color: var(--color-text-info, #0969da);
    }

    .cmd-output {
      margin: 0;
      padding: 7px 10px;
      border-top: 1px solid var(--color-border-primary, #e5e7eb);
      background: var(--color-background-tertiary, #f3f4f6);
      color: var(--color-text-secondary, #374151);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow-y: auto;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 3px 2px;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, #d0d7de);
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #1f2328);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      cursor: pointer;
    }

    .file-chip:hover {
      border-color: var(--color-ring-primary, #0969da);
    }

    .kind-add { color: var(--color-text-success, #1a7f37); font-weight: 700; }
    .kind-update, .kind-modify { color: var(--color-text-info, #0969da); font-weight: 700; }
    .kind-delete { color: var(--color-text-danger, #cf222e); font-weight: 700; }

    .log-error {
      padding: 6px 9px;
      border-radius: 6px;
      background: var(--color-background-danger, rgba(207, 34, 46, 0.1));
      color: var(--color-text-danger, #cf222e);
      font-size: 12px;
      word-break: break-word;
    }

    .handoff {
      padding: 9px 12px;
      border-top: 1px solid var(--color-border-primary, #e5e7eb);
      background: var(--color-background-primary, #ffffff);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .handoff-summary {
      font-size: 12.5px;
      color: var(--color-text-primary, #1f2328);
      font-weight: 500;
    }

    .verify-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .verify-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
    }

    .verify-cmd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--color-text-primary, #1f2328);
    }

    .verify-note {
      color: var(--color-text-secondary, #57606a);
      font-size: 11.5px;
    }

    .risks {
      margin: 0;
      padding-left: 16px;
      font-size: 12px;
      color: var(--color-text-warning, #9a6700);
    }
  </style>
</head>
<body>
  <div id="root" class="app">
    <div class="card">
      <div class="header">
        <div class="header-left">
          <span class="status-pill status-running"><span class="dot pulse"></span>Initializing</span>
        </div>
      </div>
      <div class="timeline">
        <div class="empty-hint">Connecting to Codex Worker MCP host...</div>
      </div>
    </div>
  </div>
