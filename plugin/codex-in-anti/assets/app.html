<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Worker</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--color-background-primary, #111318);
      color: var(--color-text-primary, #e6edf3);
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif);
      font-size: 13px;
      line-height: 1.55;
    }

    .app {
      padding: 8px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .app.is-panel {
      height: 100vh;
      overflow: hidden;
    }

    .app.is-inline {
      border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.22));
      border-radius: 10px;
      padding: 10px 14px;
    }

    .panel-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.2));
    }

    .run-tab {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-text-secondary, #8b949e);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .run-tab:hover {
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.12));
      color: var(--color-text-primary, #e6edf3);
    }

    .run-tab.active {
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.18));
      border-color: var(--color-border-primary, rgba(128, 128, 128, 0.35));
      color: var(--color-text-primary, #e6edf3);
      font-weight: 500;
    }

    .icon-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.25));
      background: transparent;
      color: var(--color-text-secondary, #8b949e);
      font-size: 11.5px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.12));
      color: var(--color-text-primary, #e6edf3);
    }

    .shell {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .app.is-panel .shell {
      flex: 1;
    }

    .trace-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0 6px;
    }

    .trace-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 4px;
      margin-left: -4px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--color-text-secondary, #8b949e);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .trace-toggle:hover {
      color: var(--color-text-primary, #e6edf3);
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.1));
    }

    .trace-toggle.is-error {
      color: var(--color-text-danger, #f85149);
    }

    .trace-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--color-text-tertiary, #6e7781);
    }

    .meta-sep {
      opacity: 0.45;
    }

    .stop-link {
      padding: 1px 7px;
      border-radius: 5px;
      border: 1px solid var(--color-border-danger, rgba(248, 81, 73, 0.4));
      background: transparent;
      color: var(--color-text-danger, #f85149);
      font-size: 11.5px;
      cursor: pointer;
    }

    .stop-link:hover {
      background: var(--color-background-danger, rgba(248, 81, 73, 0.12));
    }

    .prompt-strip {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 2px 0 6px;
      font-size: 12px;
      color: var(--color-text-tertiary, #6e7781);
      cursor: pointer;
      user-select: none;
    }

    .prompt-strip-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prompt-strip.expanded .prompt-strip-text {
      white-space: pre-wrap;
      word-break: break-word;
      overflow: visible;
      color: var(--color-text-secondary, #8b949e);
    }

    .timeline-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .app.is-panel .timeline-wrap {
      flex: 1;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 2px 4px 36px 0;
    }

    .app.is-inline .timeline {
      max-height: 440px;
    }

    .app.is-panel .timeline {
      height: 100%;
    }

    .timeline > * {
      flex-shrink: 0;
    }

    .empty-hint {
      padding: 10px 2px;
      font-size: 12.5px;
      color: var(--color-text-tertiary, #6e7781);
    }

    /* Group / Activity Cluster */
    .group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .group-header {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 4px;
      margin-left: -4px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--color-text-secondary, #8b949e);
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      width: fit-content;
      max-width: 100%;
    }

    .group-header:hover {
      color: var(--color-text-primary, #e6edf3);
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.1));
    }

    .group-header-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-rail {
      margin-left: 7px;
      padding-left: 14px;
      border-left: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.25));
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* Individual tool row inside rail */
    .step-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 2.5px 4px;
      margin-left: -4px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--color-text-secondary, #8b949e);
      font-size: 12.5px;
      text-align: left;
      width: 100%;
      cursor: pointer;
    }

    .step-row:hover {
      color: var(--color-text-primary, #e6edf3);
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.08));
    }

    .step-row.is-failed {
      color: var(--color-text-danger, #f85149);
    }

    .step-row.is-running {
      color: var(--color-text-primary, #e6edf3);
    }

    .step-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    .step-label.is-prose-label {
      font-family: inherit;
      font-size: 12.5px;
    }

    .step-output {
      margin: 2px 0 4px 20px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.22));
      background: var(--color-background-secondary, rgba(128, 128, 128, 0.08));
      color: var(--color-text-secondary, #9da7b3);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
    }

    /* File changes */
    .file-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 2px 0;
    }

    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.25));
      background: var(--color-background-secondary, rgba(128, 128, 128, 0.08));
      color: var(--color-text-primary, #e6edf3);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      cursor: pointer;
    }

    .file-link:hover {
      border-color: var(--color-ring-primary, #388bfd);
    }

    .kind-add { color: var(--color-text-success, #3fb950); font-weight: 700; }
    .kind-update, .kind-modify { color: var(--color-text-info, #58a6ff); font-weight: 700; }
    .kind-delete { color: var(--color-text-danger, #f85149); font-weight: 700; }

    /* Prominent Commentary Prose */
    .commentary {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--color-text-primary, #e6edf3);
      padding: 4px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .commentary code,
    .handoff-summary code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background: var(--color-background-tertiary, rgba(128, 128, 128, 0.16));
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--color-text-primary, #e6edf3);
    }

    .log-error {
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--color-background-danger, rgba(248, 81, 73, 0.12));
      color: var(--color-text-danger, #f85149);
      font-size: 12px;
      word-break: break-word;
    }

    /* Icons & Status Dots */
    .ico {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
    }

    .chev {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: transform 0.12s ease;
    }

    .chev.open {
      transform: rotate(90deg);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot.pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* Floating Circular Scroll-to-Bottom Button (Codex-style) */
    .jump-circle-btn {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.35));
      background: var(--color-background-secondary, rgba(30, 34, 42, 0.92));
      color: var(--color-text-primary, #e6edf3);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .jump-circle-btn:hover {
      background: var(--color-background-tertiary, rgba(48, 54, 65, 0.98));
      border-color: var(--color-ring-primary, #58a6ff);
    }

    /* Final Handoff Section */
    .handoff {
      flex-shrink: 0;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--color-border-primary, rgba(128, 128, 128, 0.2));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .app.is-panel .handoff {
      max-height: 220px;
      overflow-y: auto;
    }

    .handoff-summary {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--color-text-primary, #e6edf3);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .verify-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .verify-item {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
    }

    .exit-badge {
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .exit-ok {
      background: var(--color-background-success, rgba(63, 185, 80, 0.16));
      color: var(--color-text-success, #3fb950);
    }

    .exit-fail {
      background: var(--color-background-danger, rgba(248, 81, 73, 0.16));
      color: var(--color-text-danger, #f85149);
    }

    .verify-cmd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--color-text-primary, #e6edf3);
      word-break: break-word;
    }

    .verify-note {
      color: var(--color-text-secondary, #8b949e);
      font-size: 11.5px;
    }

    .risks {
      margin: 0;
      padding-left: 16px;
      font-size: 12px;
      color: var(--color-text-warning, #d29922);
    }
  </style>
</head>
<body>
  <div id="root" class="app">
    <div class="empty-hint">Connecting to Codex Worker MCP host...</div>
  </div>
